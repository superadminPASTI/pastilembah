<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Yuran Sekolah</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Excel Export (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- PDF Export (jsPDF & AutoTable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA: Manifest, Icons, Meta (Android/Chrome + iOS/Apple) -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="shortcut icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2ba401">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PASTI Admin">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff; /* Soft Blue Background */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .sidebar-active {
            background-color: #e0f2fe;
            color: #0ea5e9;
            font-weight: 700;
            border-right: 4px solid #0ea5e9;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Checkbox Custom Style */
        .custom-checkbox:checked {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }
        /* Animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Dropdown status styles */
        .status-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- KONFIGURASI PENTING ---
        // SEMUA data (login, senarai pelajar, transaksi) sekarang lalu
        // Apps Script (doPost) sahaja — TIADA lagi Publish-to-Web CSV.
        // Tukar URL di bawah ikut deployment Code.gs baharu anda.
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyUXIfp0i4P2Bu16lE4SN3CPSOwTC4WpTAu4oSOXl4xl1g3Y7EdNX1-cqSu-xIeUR7E6w/exec';
        const SESSION_STORAGE_KEY = 'tp_session';

        // --- CONFIG UNTUK DATABASE EXPORT ---
        const EXPORT_COLUMNS = [
            { id: 'Nama', label: 'Nama Pelajar' },
            { id: 'IC', label: 'No. KP / MyKid' },
            { id: 'Jantina', label: 'Jantina' },
            { id: 'Tahun', label: 'Tahun' },
            { id: 'Kelas', label: 'Kelas' },
            { id: 'Cawangan', label: 'Cawangan' },
            { id: 'Nama Waris', label: 'Nama Waris' },
            { id: 'No Tel Waris', label: 'No. Tel Waris' },
            { id: 'Alamat', label: 'Alamat' },
            { id: 'totalPaid', label: 'Jumlah Telah Bayar (RM)' },
            { id: 'balReg', label: 'Baki Pendaftaran (RM)' },
            { id: 'balMonthly', label: 'Baki Bulanan (RM)' },
            { id: 'currentBalance', label: 'Jumlah Baki Hutang (RM)' },
            { id: 'status_text', label: 'Status Akaun' }
        ];

        // --- HELPER COMPONENT: ICON ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconNode = window.lucide.icons[iconName];

                    if (iconNode && iconRef.current) {
                        iconRef.current.innerHTML = '';
                        if (window.lucide.createElement) {
                            const svgElement = window.lucide.createElement(iconNode);
                            svgElement.setAttribute('width', size);
                            svgElement.setAttribute('height', size);
                            svgElement.setAttribute('stroke-width', 2);
                            if (className) {
                                const existingClass = svgElement.getAttribute('class') || '';
                                svgElement.setAttribute('class', `${existingClass} ${className}`.trim());
                            }
                            iconRef.current.appendChild(svgElement);
                        }
                    }
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        // --- COMPONENTS ---
        const Loading = () => (
            <div className="flex flex-col items-center justify-center h-screen bg-sky-50">
                <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-sky-500 mb-4"></div>
                <h2 className="text-xl font-bold text-sky-700 animate-pulse">Sedang Memuat Data Sekolah...</h2>
                <p className="text-sky-500 text-sm mt-2">Menghubungkan ke server</p>
            </div>
        );

        const ErrorScreen = ({ message, onRetry }) => (
            <div className="flex flex-col items-center justify-center h-screen bg-red-50 text-center p-4">
                <div className="text-red-500 mb-4">
                    <Icon name="alert-triangle" size={64} />
                </div>
                <h2 className="text-2xl font-bold text-red-700 mb-2">Gagal Memuat Data</h2>
                <p className="text-red-600 mb-6 max-w-md">{message}</p>
                <button onClick={onRetry} className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-semibold transition shadow-lg">
                    Cuba Lagi
                </button>
            </div>
        );

        const StatCard = ({ title, value, subtext, color, iconName, iconColorClass }) => (
            <div className={`glass-card p-6 rounded-2xl shadow-sm border-l-4 ${color} transition hover:shadow-md`}>
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-gray-500 text-sm font-semibold uppercase tracking-wider">{title}</p>
                        <h3 className="text-3xl font-bold text-gray-800 mt-1">{value}</h3>
                        {subtext && <p className="text-xs text-gray-400 mt-2">{subtext}</p>}
                    </div>
                    <div className={`p-3 rounded-xl bg-white shadow-sm text-${iconColorClass}`}>
                        <Icon name={iconName} size={24} className={`text-${iconColorClass}`} />
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = sessionStorage.getItem(SESSION_STORAGE_KEY);
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    return null;
                }
            });
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            const [view, setView] = useState('dashboard');
            const [students, setStudents] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [updatingStatus, setUpdatingStatus] = useState(null); 
            
            // --- State untuk Tapis Jadual Transaksi ---
            const [txFilters, setTxFilters] = useState({
                date: '',
                name: '',
                type: 'Semua',
                desc: '',
                amount: '',
                verification: 'Semua'
            });

            const [exportCols, setExportCols] = useState(EXPORT_COLUMNS.map(c => c.id));
            const [filters, setFilters] = useState({
                search: '',
                class: 'Semua',
                branch: 'Semua',
                year: 'Semua',
                month: 'Semua',
                status: 'Semua',
                type: 'Semua'
            });

            // --- State untuk Urus Admin (SuperAdmin sahaja) ---
            const [admins, setAdmins] = useState([]);
            const [loadingAdmins, setLoadingAdmins] = useState(false);
            const [savingAdmin, setSavingAdmin] = useState(false);
            const [deletingAdminEmail, setDeletingAdminEmail] = useState(null);
            const [adminFormError, setAdminFormError] = useState('');
            const [adminFormSuccess, setAdminFormSuccess] = useState('');
            const [adminForm, setAdminForm] = useState({ email: '', password: '', role: 'admin', cawangan: '' });

            // --- State untuk Log Masuk (SuperAdmin sahaja) ---
            const [loginLogs, setLoginLogs] = useState([]);
            const [loadingLogs, setLoadingLogs] = useState(false);
            const [logFilter, setLogFilter] = useState({ email: '', result: 'Semua' });

            // --- State untuk Database Guru (Admin & SuperAdmin) ---
            const [guruList, setGuruList] = useState([]);
            const [loadingGuru, setLoadingGuru] = useState(false);
            const [savingGuru, setSavingGuru] = useState(false);
            const [deletingGuruId, setDeletingGuruId] = useState(null);
            const [guruFormError, setGuruFormError] = useState('');
            const [guruFormSuccess, setGuruFormSuccess] = useState('');
            const [guruForm, setGuruForm] = useState({ id: '', nama: '', noTelefon: '', cawangan: '', kelas: '' });

            // Helper function to parse dates correctly for sorting (DD/MM/YYYY HH:mm:ss)
            const parseDateString = (dateStr) => {
                if (!dateStr) return 0;
                try {
                    const [datePart, timePart] = dateStr.split(' ');
                    if (!datePart) return 0;
                    const [day, month, year] = datePart.split('/');
                    const [hour, min, sec] = (timePart || '00:00:00').split(':');
                    return new Date(year, month - 1, day, hour, min, sec).getTime();
                } catch (e) {
                    return 0; // Fallback if parsing fails
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                setLoginError('');
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'LOGIN', email: loginEmail, password: loginPassword, userAgent: navigator.userAgent })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        const user = { Email: result.email, Role: result.role, Cawangan: result.cawangan, token: result.token };
                        setCurrentUser(user);
                        try { sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(user)); } catch (e) {}
                        // Kunci filter cawangan jika dia bukan superadmin
                        setFilters(prev => ({ ...prev, branch: user.Role.toLowerCase() === 'superadmin' ? 'Semua' : user.Cawangan }));
                    } else {
                        setLoginError(result.message || 'E-mel atau Kata Laluan tidak sah.');
                    }
                } catch (err) {
                    setLoginError('Ralat menyambung ke server. Sila cuba lagi.');
                }
                setIsLoggingIn(false);
            };

            const handleLogout = () => {
                if (currentUser && currentUser.token) {
                    fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'LOGOUT', token: currentUser.token }) }).catch(() => {});
                }
                try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
                setCurrentUser(null);
                setView('dashboard');
                setStudents([]);
                setTransactions([]);
                setLoginEmail('');
                setLoginPassword('');
            };

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'GET_DASHBOARD_DATA', token: currentUser.token })
                    });
                    const result = await response.json();

                    if (result.result !== 'success') {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat') || msg.includes('forbidden')) {
                            handleLogout();
                            return;
                        }
                        throw new Error(result.message || 'Gagal memuat data dari server.');
                    }

                    // Server dah kira isolasi cawangan — tak perlu filter lagi kat client
                    const allTransactions = result.transactions || [];

                    // SORTING LOGIC: Newest to Oldest explicitly using Custom Date Parser
                    allTransactions.sort((a, b) => parseDateString(b.Timestamp) - parseDateString(a.Timestamp));

                    setStudents(result.students || []);
                    setTransactions(allTransactions);
                } catch (err) {
                    console.error("Dashboard data error:", err);
                    setError(err.message || "Gagal membaca data dari server.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (currentUser) {
                    fetchData();
                }
            }, [currentUser]);

            // --- Urus Admin: senarai, tambah, kemaskini (SuperAdmin sahaja) ---
            const fetchAdmins = async () => {
                setLoadingAdmins(true);
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'LIST_ADMINS', token: currentUser.token })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setAdmins(result.admins || []);
                    } else {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat') || msg.includes('forbidden')) {
                            handleLogout();
                        }
                    }
                } catch (err) {
                    console.error('Gagal muat senarai admin:', err);
                } finally {
                    setLoadingAdmins(false);
                }
            };

            useEffect(() => {
                if (view === 'admins' && currentUser && currentUser.Role.toLowerCase() === 'superadmin') {
                    fetchAdmins();
                }
            }, [view, currentUser]);

            const editAdmin = (admin) => {
                setAdminForm({ email: admin.email, password: '', role: admin.role || 'admin', cawangan: admin.cawangan || '' });
                setAdminFormError('');
                setAdminFormSuccess('');
            };

            const resetAdminForm = () => {
                setAdminForm({ email: '', password: '', role: 'admin', cawangan: '' });
                setAdminFormError('');
                setAdminFormSuccess('');
            };

            const saveAdmin = async (e) => {
                e.preventDefault();
                setSavingAdmin(true);
                setAdminFormError('');
                setAdminFormSuccess('');
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'SAVE_ADMIN',
                            token: currentUser.token,
                            email: adminForm.email,
                            password: adminForm.password,
                            role: adminForm.role,
                            cawangan: adminForm.cawangan
                        })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setAdminFormSuccess(result.message || 'Berjaya disimpan.');
                        setAdminForm({ email: '', password: '', role: 'admin', cawangan: '' });
                        fetchAdmins();
                    } else {
                        setAdminFormError(result.message || 'Gagal menyimpan admin.');
                    }
                } catch (err) {
                    setAdminFormError('Ralat menyambung ke server.');
                } finally {
                    setSavingAdmin(false);
                }
            };

            const deleteAdmin = async (admin) => {
                if (admin.email.toLowerCase() === (currentUser.Email || '').toLowerCase()) {
                    alert('Tak boleh padam akaun sendiri.');
                    return;
                }
                if (!window.confirm(`Padam akaun admin "${admin.email}"? Tindakan ni tak boleh diundur.`)) return;

                setDeletingAdminEmail(admin.email);
                setAdminFormError('');
                setAdminFormSuccess('');
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'DELETE_ADMIN', token: currentUser.token, email: admin.email })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setAdminFormSuccess(result.message || 'Admin berjaya dipadam.');
                        fetchAdmins();
                    } else {
                        setAdminFormError(result.message || 'Gagal memadam admin.');
                    }
                } catch (err) {
                    setAdminFormError('Ralat menyambung ke server.');
                } finally {
                    setDeletingAdminEmail(null);
                }
            };

            // --- Database Guru: senarai, tambah, kemaskini, padam (Admin & SuperAdmin) ---
            // SuperAdmin nampak semua cawangan; Admin biasa server-side ditapis ke
            // cawangan dia sahaja (rujuk handleListGuru_ dalam Code.gs). guruList juga
            // dimuat semula bila borang Tambah/Edit Pelajar dibuka (view === 'addstudent')
            // supaya dropdown "Guru Kelas" di situ sentiasa terkini.
            const fetchGuru = async () => {
                setLoadingGuru(true);
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'LIST_GURU', token: currentUser.token })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setGuruList(result.guru || []);
                    } else {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat') || msg.includes('forbidden')) {
                            handleLogout();
                        }
                    }
                } catch (err) {
                    console.error('Gagal muat senarai guru:', err);
                } finally {
                    setLoadingGuru(false);
                }
            };

            useEffect(() => {
                if (!currentUser) return;
                if (view === 'guru' || view === 'addstudent') {
                    fetchGuru();
                }
                if (view === 'guru') {
                    setGuruForm(prev => ({
                        ...prev,
                        cawangan: currentUser.Role.toLowerCase() === 'superadmin' ? prev.cawangan : currentUser.Cawangan
                    }));
                }
            }, [view, currentUser]);

            const resetGuruForm = () => {
                setGuruForm({
                    id: '',
                    nama: '',
                    noTelefon: '',
                    cawangan: currentUser.Role.toLowerCase() === 'superadmin' ? '' : currentUser.Cawangan,
                    kelas: ''
                });
                setGuruFormError('');
                setGuruFormSuccess('');
            };

            const editGuru = (guru) => {
                setGuruForm({
                    id: guru.id,
                    nama: guru.nama || '',
                    noTelefon: guru.noTelefon || '',
                    cawangan: guru.cawangan || '',
                    kelas: guru.kelas || ''
                });
                setGuruFormError('');
                setGuruFormSuccess('');
            };

            const saveGuru = async (e) => {
                e.preventDefault();
                setGuruFormError('');
                setGuruFormSuccess('');
                if (!guruForm.nama.trim()) {
                    setGuruFormError('Nama guru diperlukan.');
                    return;
                }
                setSavingGuru(true);
                try {
                    const isEditing = !!guruForm.id;
                    const payload = {
                        action: isEditing ? 'UPDATE_GURU' : 'ADD_GURU',
                        token: currentUser.token,
                        nama: guruForm.nama,
                        noTelefon: guruForm.noTelefon,
                        cawangan: guruForm.cawangan,
                        kelas: guruForm.kelas
                    };
                    if (isEditing) payload.id = guruForm.id;

                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setGuruFormSuccess(result.message || (isEditing ? 'Guru berjaya dikemaskini.' : 'Guru baharu berjaya ditambah.'));
                        resetGuruForm();
                        fetchGuru();
                    } else {
                        setGuruFormError(result.message || 'Gagal menyimpan guru.');
                    }
                } catch (err) {
                    setGuruFormError('Ralat menyambung ke server.');
                } finally {
                    setSavingGuru(false);
                }
            };

            const deleteGuru = async (guru) => {
                if (!window.confirm(`Padam guru "${guru.nama}"? Tindakan ni tak boleh diundur.`)) return;
                setDeletingGuruId(guru.id);
                setGuruFormError('');
                setGuruFormSuccess('');
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'DELETE_GURU', token: currentUser.token, id: guru.id })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setGuruFormSuccess(result.message || 'Guru berjaya dipadam.');
                        fetchGuru();
                    } else {
                        setGuruFormError(result.message || 'Gagal memadam guru.');
                    }
                } catch (err) {
                    setGuruFormError('Ralat menyambung ke server.');
                } finally {
                    setDeletingGuruId(null);
                }
            };

            // --- Log Masuk: sejarah KEKAL percubaan log masuk (SuperAdmin sahaja) ---
            const fetchLoginLogs = async () => {
                setLoadingLogs(true);
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'LIST_LOGIN_LOG', token: currentUser.token })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setLoginLogs(result.logs || []);
                    } else {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat') || msg.includes('forbidden')) {
                            handleLogout();
                        }
                    }
                } catch (err) {
                    console.error('Gagal muat log masuk:', err);
                } finally {
                    setLoadingLogs(false);
                }
            };

            useEffect(() => {
                if (view === 'loginlog' && currentUser && currentUser.Role.toLowerCase() === 'superadmin') {
                    fetchLoginLogs();
                }
            }, [view, currentUser]);

            const filteredLoginLogs = useMemo(() => {
                return loginLogs.filter(l => {
                    const matchEmail = (l.email || '').toLowerCase().includes(logFilter.email.toLowerCase());
                    const matchResult = logFilter.result === 'Semua' || l.result === logFilter.result;
                    return matchEmail && matchResult;
                });
            }, [loginLogs, logFilter]);

            // ================================================================
            // TAMBAH PELAJAR (Admin & SuperAdmin) — borang satu-satu + muat
            // naik pukal CSV. Admin biasa Cawangan dia SENTIASA dipaksa
            // server-side ke cawangan sesi log masuk dia (rujuk Code.gs) —
            // field Cawangan di sini cuma "dikunci" di UI untuk kejelasan,
            // bukan satu-satunya perlindungan.
            // ================================================================
            const STUDENT_CSV_HEADERS = ['Nama', 'IC', 'Jantina', 'Tahun', 'Kelas', 'Cawangan', 'Guru Kelas', 'No Guru Kelas', 'Nama Waris', 'No Tel Waris', 'Alamat', 'Yuran Pendaftaran', 'Yuran Bulanan', 'Gambar Pelajar'];

            const emptyStudentForm = { nama: '', ic: '', jantina: 'L', tahun: '', kelas: '', cawangan: '', guruKelas: '', noGuruKelas: '', namaWaris: '', noTelWaris1: '', noTelWaris2: '', alamat: '', yuranPendaftaran: '', yuranBulanan: '' };

            const [addStudentTab, setAddStudentTab] = useState('single'); // 'single' | 'bulk'
            const [studentForm, setStudentForm] = useState(emptyStudentForm);
            const [studentPhotoFile, setStudentPhotoFile] = useState(null);
            const [studentPhotoPreview, setStudentPhotoPreview] = useState('');
            const [savingStudent, setSavingStudent] = useState(false);
            const [studentFormError, setStudentFormError] = useState('');
            const [studentFormSuccess, setStudentFormSuccess] = useState('');
            const [editingStudentIC, setEditingStudentIC] = useState(null); // null = mod Tambah; ada value = mod Edit

            // Auto-detect Jantina dari "bin"/"binti" dalam Nama. \b = word
            // boundary — "binti" disemak DULU (dan \bbin\b memang takkan
            // match "binti" pun sebab lepas "bin" ada "ti", tiada boundary)
            // supaya "Fatimah Binti Ali" tak silap detect sebagai Lelaki.
            const detectJantinaFromName = (nama) => {
                if (/\bbinti\b/i.test(nama)) return 'P';
                if (/\bbin\b/i.test(nama)) return 'L';
                return null;
            };

            // Auto-kira Tahun (umur) dari 2 digit pertama IC — anggap lahir
            // 20XX (sesuai konteks kanak-kanak tadika, tiada ambiguiti abad
            // macam pengiraan IC dewasa). Cth: IC mula "22" -> lahir 2022 ->
            // umur (tahun semasa - 2022).
            const calculateAgeFromIC = (ic) => {
                const digits = (ic || '').toString().replace(/[^0-9]/g, '');
                if (digits.length < 2) return null;
                const yy = parseInt(digits.substring(0, 2), 10);
                if (isNaN(yy)) return null;
                const birthYear = 2000 + yy;
                const age = new Date().getFullYear() - birthYear;
                return (age >= 0 && age <= 25) ? String(age) : null; // sanity check, elak nombor pelik
            };

            const [bulkRows, setBulkRows] = useState([]);
            const [bulkFileName, setBulkFileName] = useState('');
            const [bulkUploading, setBulkUploading] = useState(false);
            const [bulkError, setBulkError] = useState('');
            const [bulkResult, setBulkResult] = useState(null);

            // Bila buka page Tambah Pelajar — pra-isi Cawangan admin biasa
            // (SuperAdmin dibiar kosong, pilih sendiri dari datalist cawangan).
            useEffect(() => {
                if (view === 'addstudent' && currentUser) {
                    setStudentForm(prev => ({
                        ...prev,
                        cawangan: currentUser.Role.toLowerCase() === 'superadmin' ? prev.cawangan : currentUser.Cawangan
                    }));
                }
            }, [view, currentUser]);

            const resetStudentForm = () => {
                setStudentForm({
                    ...emptyStudentForm,
                    cawangan: currentUser.Role.toLowerCase() === 'superadmin' ? '' : currentUser.Cawangan
                });
                setEditingStudentIC(null);
                setStudentPhotoFile(null);
                setStudentPhotoPreview('');
                setStudentFormError('');
                setStudentFormSuccess('');
            };

            // Buka borang dalam mod TAMBAH (kosong) — dipanggil dari button
            // "+ Tambah Pelajar" dalam Database Pelajar.
            const openAddStudentForm = () => {
                resetStudentForm();
                setAddStudentTab('single');
                setView('addstudent');
            };

            // Buka borang dalam mod EDIT — pra-isi semua field dari rekod
            // pelajar sedia ada (termasuk pisahkan semula "No Tel Waris" JSON
            // jadi 2 slot input berasingan, dan papar gambar sedia ada kalau ada).
            const openEditStudentForm = (student) => {
                const phones = parsePhoneNumbers(student['No Tel Waris']);
                setStudentForm({
                    nama: student['Nama'] || '',
                    ic: student['IC'] || '',
                    jantina: student['Jantina'] || 'L',
                    tahun: student['Tahun'] || '',
                    kelas: student['Kelas'] || '',
                    cawangan: student['Cawangan'] || '',
                    guruKelas: student['Guru Kelas'] || '',
                    noGuruKelas: student['No Guru Kelas'] || '',
                    namaWaris: student['Nama Waris'] || '',
                    noTelWaris1: phones[0] || '',
                    noTelWaris2: phones[1] || '',
                    alamat: student['Alamat'] || '',
                    yuranPendaftaran: student['Yuran Pendaftaran'] || '',
                    yuranBulanan: student['Yuran Bulanan'] || ''
                });
                setEditingStudentIC(student['IC'] || '');
                setStudentPhotoFile(null);
                setStudentPhotoPreview(getPhotoUrl(student['Gambar Pelajar']) || '');
                setStudentFormError('');
                setStudentFormSuccess('');
                setAddStudentTab('single');
                setView('addstudent');
            };

            const handleStudentPhotoChange = (e) => {
                const file = e.target.files[0];
                if (!file) { setStudentPhotoFile(null); setStudentPhotoPreview(''); return; }
                setStudentPhotoFile(file);
                const reader = new FileReader();
                reader.onload = () => setStudentPhotoPreview(reader.result);
                reader.readAsDataURL(file);
            };

            const fileToBase64Payload = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result || '';
                    const base64 = dataUrl.split(',')[1] || '';
                    resolve({ base64, mimeType: file.type || 'image/jpeg' });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });

            const saveStudent = async (e) => {
                e.preventDefault();
                setStudentFormError('');
                setStudentFormSuccess('');

                if (!studentForm.nama.trim() || !studentForm.ic.trim()) {
                    setStudentFormError('Nama dan No. IC/MyKid wajib diisi.');
                    return;
                }

                setSavingStudent(true);
                try {
                    let photoPayload = { base64: '', mimeType: '' };
                    if (studentPhotoFile) {
                        photoPayload = await fileToBase64Payload(studentPhotoFile);
                    }

                    const phone1 = studentForm.noTelWaris1.trim();
                    const phone2 = studentForm.noTelWaris2.trim();
                    const noTelWaris = phone2 ? JSON.stringify([phone1, phone2].filter(Boolean)) : phone1;
                    const isEditing = !!editingStudentIC;

                    const payload = {
                        action: isEditing ? 'UPDATE_STUDENT' : 'ADD_STUDENT',
                        token: currentUser.token,
                        nama: studentForm.nama,
                        ic: studentForm.ic,
                        jantina: studentForm.jantina,
                        tahun: studentForm.tahun,
                        kelas: studentForm.kelas,
                        cawangan: studentForm.cawangan,
                        guruKelas: studentForm.guruKelas,
                        noGuruKelas: studentForm.noGuruKelas,
                        namaWaris: studentForm.namaWaris,
                        noTelWaris: noTelWaris,
                        alamat: studentForm.alamat,
                        yuranPendaftaran: studentForm.yuranPendaftaran,
                        yuranBulanan: studentForm.yuranBulanan,
                        photoBase64: photoPayload.base64,
                        photoMimeType: photoPayload.mimeType,
                        photoFilename: studentPhotoFile ? studentPhotoFile.name : ''
                    };
                    if (isEditing) payload.originalIc = editingStudentIC;

                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setStudentFormSuccess(result.message || (isEditing ? 'Pelajar berjaya dikemaskini.' : 'Pelajar baharu berjaya ditambah.'));
                        resetStudentForm();
                        fetchData();
                    } else {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat')) { handleLogout(); return; }
                        setStudentFormError(result.message || (isEditing ? 'Gagal mengemaskini pelajar.' : 'Gagal menambah pelajar.'));
                    }
                } catch (err) {
                    setStudentFormError('Ralat menyambung ke server.');
                } finally {
                    setSavingStudent(false);
                }
            };

            // --- Muat Naik Pukal (CSV) ---
            const csvEscape = (val) => {
                const str = String(val === undefined || val === null ? '' : val);
                if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
                return str;
            };

            const downloadStudentTemplate = () => {
                const exampleRow = {
                    'Nama': 'Ahmad bin Ali',
                    'IC': '180101101234',
                    'Jantina': 'L',
                    'Tahun': '2026',
                    'Kelas': 'Iqra 2',
                    'Cawangan': currentUser.Role.toLowerCase() === 'superadmin' ? 'Al Furqan' : currentUser.Cawangan,
                    'Guru Kelas': 'Cikgu Siti',
                    'No Guru Kelas': '0123456789',
                    'Nama Waris': 'Ali bin Abu',
                    'No Tel Waris': '0123456789',
                    'Alamat': 'No 1 Jalan Contoh 43000 Kajang Selangor',
                    'Yuran Pendaftaran': '250',
                    'Yuran Bulanan': '150',
                    'Gambar Pelajar': ''
                };
                const headerLine = STUDENT_CSV_HEADERS.map(csvEscape).join(',');
                const dataLine = STUDENT_CSV_HEADERS.map(h => csvEscape(exampleRow[h])).join(',');
                const csv = headerLine + '\r\n' + dataLine + '\r\n';
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Template_Tambah_Pelajar.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Anotasi setiap baris CSV yang di-parse dengan status pra-semak
            // (client-side, UX sahaja — server SENTIASA re-validate semula,
            // rujuk handleBulkAddStudents_ dalam Code.gs).
            const annotateBulkRows = (parsedRows) => {
                const existingIcSet = new Set(students.map(s => (s.IC || '').toString().replace(/[^0-9]/g, '')).filter(Boolean));
                const seenInFile = new Set();
                const isSuperAdmin = currentUser.Role.toLowerCase() === 'superadmin';
                return parsedRows.map((r, idx) => {
                    const nama = (r['Nama'] || '').toString().trim();
                    const ic = (r['IC'] || '').toString().trim();
                    const icDigits = ic.replace(/[^0-9]/g, '');
                    let status = 'ok';
                    let reason = '';
                    const rowCawangan = (r['Cawangan'] || '').toString().trim();

                    if (!nama || !icDigits) {
                        status = 'error'; reason = 'Nama atau No. IC kosong';
                    } else if (existingIcSet.has(icDigits) || seenInFile.has(icDigits)) {
                        status = 'error'; reason = 'No. IC sudah wujud (sistem atau berulang dalam fail ini)';
                    } else if (isSuperAdmin && !rowCawangan) {
                        status = 'error'; reason = 'Cawangan kosong (wajib untuk SuperAdmin)';
                    } else if (!isSuperAdmin && rowCawangan && rowCawangan !== currentUser.Cawangan) {
                        status = 'warning'; reason = 'Akan ditukar ke cawangan anda (' + currentUser.Cawangan + ')';
                    }
                    if (status !== 'error' && icDigits) seenInFile.add(icDigits);
                    return Object.assign({ _row: idx + 2, _status: status, _reason: reason }, r);
                });
            };

            const handleBulkFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setBulkError('');
                setBulkResult(null);
                setBulkFileName(file.name);
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (!results.data || results.data.length === 0) {
                            setBulkError('Fail CSV kosong atau format tidak sah.');
                            setBulkRows([]);
                            return;
                        }
                        setBulkRows(annotateBulkRows(results.data));
                    },
                    error: (err) => {
                        setBulkError('Gagal membaca fail CSV: ' + err.message);
                    }
                });
            };

            const resetBulkUpload = () => {
                setBulkRows([]);
                setBulkFileName('');
                setBulkError('');
                setBulkResult(null);
            };

            const submitBulkStudents = async () => {
                const validRows = bulkRows.filter(r => r._status !== 'error').map((r) => {
                    const clean = Object.assign({}, r);
                    delete clean._row; delete clean._status; delete clean._reason;
                    return clean;
                });
                if (validRows.length === 0) {
                    setBulkError('Tiada rekod sah untuk dimuat naik.');
                    return;
                }
                setBulkUploading(true);
                setBulkError('');
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'BULK_ADD_STUDENTS', token: currentUser.token, students: validRows })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setBulkResult(result);
                        setBulkRows([]);
                        setBulkFileName('');
                        fetchData();
                    } else {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat')) { handleLogout(); return; }
                        setBulkError(result.message || 'Gagal muat naik.');
                    }
                } catch (err) {
                    setBulkError('Ralat menyambung ke server.');
                } finally {
                    setBulkUploading(false);
                }
            };

            const updateStatus = async (tx, newStatus) => {
                if (!APPS_SCRIPT_URL) {
                    alert("Sila tetapkan APPS_SCRIPT_URL dalam kod index.html dahulu untuk membolehkan fungsi Edit!");
                    return;
                }
                
                const txId = tx.Timestamp + tx.NAMA;
                setUpdatingStatus(txId);

                try {
                    const payload = {
                        action: 'UPDATE_STATUS',
                        token: currentUser.token,
                        sheetType: tx._type,
                        timestamp: tx.Timestamp,
                        ic: tx.IC || '',
                        nama: tx.NAMA,
                        newStatus: newStatus
                    };

                    const updatedTransactions = transactions.map(t => {
                        if (t.Timestamp === tx.Timestamp && t.NAMA === tx.NAMA) {
                            return { ...t, VERIFICATION: newStatus };
                        }
                        return t;
                    });
                    setTransactions(updatedTransactions);

                    const response = await fetch(APPS_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify(payload) 
                    });
                    const result = await response.json();
                    
                    if (result.result !== 'success') {
                        throw new Error(result.message || "Gagal kemas kini di server");
                    }
                    console.log("Status berjaya dikemaskini");
                } catch (err) {
                    console.error("Kemas kini gagal:", err);
                    alert("Gagal mengemaskini status: " + err.message);
                    fetchData(); 
                } finally {
                    setUpdatingStatus(null);
                }
            };

            const studentData = useMemo(() => {
                return students.map(student => {
                    const studentTxs = transactions.filter(t => t['IC'] === student['IC']);
                    const monthlyTxs = studentTxs.filter(t => t._type === 'Bulanan');
                    const regTxs = studentTxs.filter(t => t._type === 'Pendaftaran');

                    let balMonthly = 0;
                    if (monthlyTxs.length > 0) {
                        const latest = monthlyTxs.sort((a, b) => parseDateString(b['Timestamp']) - parseDateString(a['Timestamp']))[0];
                        balMonthly = parseFloat((latest['BAKI'] || '0').replace(/[^0-9.-]+/g,""));
                    } else {
                        balMonthly = parseFloat((student['Yuran Bulanan'] || '0').replace(/[^0-9.-]+/g,""));
                    }

                    let balReg = 0;
                    if (regTxs.length > 0) {
                         const latest = regTxs.sort((a, b) => parseDateString(b['Timestamp']) - parseDateString(a['Timestamp']))[0];
                         balReg = parseFloat((latest['BAKI'] || '0').replace(/[^0-9.-]+/g,""));
                    } else {
                        balReg = parseFloat((student['Yuran Pendaftaran'] || '0').replace(/[^0-9.-]+/g,""));
                    }

                    const totalPaid = studentTxs.reduce((sum, tx) => {
                        const amount = parseFloat((tx['JUMLAH BAYARAN'] || '0').replace(/[^0-9.-]+/g,""));
                        return sum + (isNaN(amount) ? 0 : amount);
                    }, 0);

                    const currentBalance = (isNaN(balMonthly) ? 0 : balMonthly) + (isNaN(balReg) ? 0 : balReg);

                    return {
                        ...student,
                        transactions: studentTxs,
                        totalPaid: totalPaid,
                        currentBalance: currentBalance,
                        balMonthly: isNaN(balMonthly) ? 0 : balMonthly,
                        balReg: isNaN(balReg) ? 0 : balReg,
                        status_text: currentBalance > 0 ? 'Tertunggak' : 'Selesai'
                    };
                });
            }, [students, transactions]);

            const filteredStudents = useMemo(() => {
                return studentData.filter(s => {
                    const matchSearch = (s['Nama'] || '').toLowerCase().includes(filters.search.toLowerCase()) || 
                                        (s['IC'] || '').includes(filters.search);
                    const matchClass = filters.class === 'Semua' || s['Kelas'] === filters.class;
                    const matchBranch = filters.branch === 'Semua' || s['Cawangan'] === filters.branch;
                    const matchYear = filters.year === 'Semua' || s['Tahun'] === filters.year;
                    const matchMonth = filters.month === 'Semua' || s.transactions.some(t => t['BULAN'] === filters.month);

                    let matchStatus = true;
                    let balanceToCheck = s.currentBalance;
                    if (filters.type === 'Pendaftaran') balanceToCheck = s.balReg;
                    if (filters.type === 'Bulanan') balanceToCheck = s.balMonthly;

                    if (filters.status === 'Tertunggak') matchStatus = balanceToCheck > 0;
                    if (filters.status === 'Selesai') matchStatus = balanceToCheck <= 0;
                    
                    return matchSearch && matchClass && matchBranch && matchYear && matchMonth && matchStatus;
                });
            }, [studentData, filters]);

            // --- Logik Tapisan (Filter) Jadual Transaksi ---
            const filteredTransactionsList = useMemo(() => {
                return transactions.filter(tx => {
                    const matchDate = (tx.Timestamp || '').toLowerCase().includes(txFilters.date.toLowerCase());
                    const matchName = (tx.NAMA || '').toLowerCase().includes(txFilters.name.toLowerCase());
                    const matchType = txFilters.type === 'Semua' || tx._type === txFilters.type;
                    const matchDesc = (tx.BULAN || tx['JENIS YURAN'] || '').toLowerCase().includes(txFilters.desc.toLowerCase());
                    const matchAmount = (tx['JUMLAH BAYARAN'] || '').toString().toLowerCase().includes(txFilters.amount.toLowerCase());
                    const txStatus = tx['VERIFICATION'] || 'PENDING';
                    const matchVer = txFilters.verification === 'Semua' || txStatus === txFilters.verification;

                    return matchDate && matchName && matchType && matchDesc && matchAmount && matchVer;
                });
            }, [transactions, txFilters]);

            // --- Pagination Rekod Transaksi — 30 rekod setiap muka surat ---
            const TX_PER_PAGE = 30;
            const [txPage, setTxPage] = useState(1);
            const txTotalPages = Math.max(1, Math.ceil(filteredTransactionsList.length / TX_PER_PAGE));

            // Reset ke muka surat 1 bila-bila tapisan tukar (elak "stuck" di
            // muka surat lama yang dah tak relevan lepas tapis).
            useEffect(() => { setTxPage(1); }, [txFilters]);
            // Selamatkan diri kalau muka surat semasa jadi tak sah (cth: hasil
            // tapisan mengecil sehingga jumlah muka surat kurang dari sebelum ini).
            useEffect(() => { if (txPage > txTotalPages) setTxPage(txTotalPages); }, [txTotalPages]);

            const paginatedTransactions = useMemo(() => {
                const start = (txPage - 1) * TX_PER_PAGE;
                return filteredTransactionsList.slice(start, start + TX_PER_PAGE);
            }, [filteredTransactionsList, txPage]);

            const stats = useMemo(() => {
                const totalStudents = studentData.length;
                const totalOutstanding = studentData.reduce((sum, student) => sum + (student.currentBalance > 0 ? student.currentBalance : 0), 0);
                const totalCollection = transactions.reduce((sum, tx) => {
                      const amount = parseFloat((tx['JUMLAH BAYARAN'] || '0').replace(/[^0-9.-]+/g,""));
                      return sum + (isNaN(amount) ? 0 : amount);
                }, 0);
                
                const collectionByMonth = {};
                transactions.forEach(tx => {
                    let month = tx['BULAN'];
                    if (!month || month.trim() === '') month = 'Yuran Pendaftaran';
                    const amount = parseFloat((tx['JUMLAH BAYARAN'] || '0').replace(/[^0-9.-]+/g,""));
                    if (!collectionByMonth[month]) collectionByMonth[month] = 0;
                    collectionByMonth[month] += (isNaN(amount) ? 0 : amount);
                });

                return { totalStudents, totalCollection, totalOutstanding, collectionByMonth };
            }, [studentData, transactions]);

            const classes = useMemo(() => ['Semua', ...Array.from(new Set(students.map(s => s['Kelas']).filter(Boolean)))], [students]);
            const branches = useMemo(() => {
                if (currentUser && currentUser.Role.toLowerCase() !== 'superadmin') return [currentUser.Cawangan];
                return ['Semua', ...Array.from(new Set(students.map(s => s['Cawangan']).filter(Boolean)))];
            }, [students, currentUser]);
            // Senarai cawangan sebenar (tiada 'Semua') — untuk dropdown borang Urus Admin
            const realBranches = useMemo(() => Array.from(new Set(students.map(s => s['Cawangan']).filter(Boolean))), [students]);
            // Guru ditapis ikut Cawangan yang dipilih dalam borang Tambah/Edit Pelajar —
            // sumber pilihan dropdown "Guru Kelas" (rujuk saveStudent/openAddStudentForm).
            const guruForBranch = useMemo(() => guruList.filter(g => !studentForm.cawangan || g.cawangan === studentForm.cawangan), [guruList, studentForm.cawangan]);
            const years = useMemo(() => ['Semua', ...Array.from(new Set(students.map(s => s['Tahun']).filter(Boolean)))].sort(), [students]);
            const months = useMemo(() => ['Semua', ...Array.from(new Set(transactions.map(t => t['BULAN']).filter(Boolean)))], [transactions]);

            const formatRM = (val) => "RM " + (parseFloat(val) || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // Parse "No Tel Waris" — boleh JSON array (2+ nombor, contoh:
            // ["0123456789","0198765432"]) ATAU plain single nombor (data
            // lama, backward compatible).
            const parsePhoneNumbers = (raw) => {
                if (!raw) return [];
                const str = raw.toString().trim();
                if (!str) return [];
                if (str.charAt(0) === '[') {
                    try {
                        const arr = JSON.parse(str);
                        if (Array.isArray(arr)) return arr.map(v => String(v).trim()).filter(Boolean);
                    } catch (e) {
                        // JSON tak valid — fallback ke bawah
                    }
                }
                return [str];
            };
            const formatPhoneList = (raw) => parsePhoneNumbers(raw).join(' / ');

            const getPhotoUrl = (url) => {
                if (!url) return null;
                if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                    const match = url.match(/(?:\/d\/|id=)([-\w]+)/);
                    if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
                return url;
            };

            const sendWhatsAppReminder = (student) => {
                const phones = parsePhoneNumbers(student['No Tel Waris']);
                const phone = phones[0];
                if (!phone) {
                    alert("Nombor telefon waris tiada.");
                    return;
                }
                let cleanPhone = phone.toString().replace(/[^0-9]/g, '');
                if (cleanPhone.startsWith('0')) cleanPhone = '60' + cleanPhone.substring(1);

                let message = "";
                if (student.currentBalance > 0) {
                    message = `Assalamualaikum dan salam sejahtera En/Cik ${student['Nama Waris'] || ''}\n\nBerikut merupakan baki tertunggak yang perlu dibayar bagi *${student.Nama}*:\n\n*Jumlah Tertunggak: ${formatRM(student.currentBalance)}*\n------------------------------\nPecahan Baki:\n• Baki Pendaftaran: ${formatRM(student.balReg)}\n• Baki Bulanan: ${formatRM(student.balMonthly)}\n\nMohon jelaskan bayaran secepat mungkin. Terima kasih.`;
                } else {

                return filteredStudents.map(student => {

                        if (exportCols.includes(col.id)) {
                            if (['totalPaid', 'balReg', 'balMonthly', 'currentBalance'].includes(col.id)) {
                                row[col.label] = (parseFloat(student[col.id]) || 0).toFixed(2);

                    return;

                doc.text(`Jumlah Rekod: ${rows.length}`, 14, 33);
                doc.autoTable({ 
                    head: [headers], 
                    body: rows, 
                    startY: 40, 
                    theme: 'grid',
