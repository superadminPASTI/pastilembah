                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">
                                                    No. IC / MyKid * {editingStudentIC && <span className="font-normal text-slate-400">(tak boleh ditukar)</span>}
                                                </label>
                                                <input
                                                    required
                                                    disabled={!!editingStudentIC}
                                                    value={studentForm.ic}
                                                    onChange={e => {
                                                        const val = e.target.value;
                                                        const age = calculateAgeFromIC(val);
                                                        setStudentForm(prev => ({ ...prev, ic: val, tahun: age !== null ? age : prev.tahun }));
                                                    }}
                                                    className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200 disabled:bg-slate-100 disabled:text-slate-400"
                                                    placeholder="cth: 220212140617"
                                                />
                                                {editingStudentIC && <p className="text-[10px] text-slate-400 mt-1">IC silap? Betulkan terus di Google Sheet — rekod bayaran lama guna IC ni untuk padanan.</p>}
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Jantina <span className="font-normal text-slate-400">(auto dari Nama — boleh tukar)</span></label>
                                                <select value={studentForm.jantina} onChange={e => setStudentForm({ ...studentForm, jantina: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200 bg-white">
                                                    <option value="L">Lelaki</option>
                                                    <option value="P">Perempuan</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Tahun (Umur) <span className="font-normal text-slate-400">(auto dari IC — boleh tukar)</span></label>
                                                <input value={studentForm.tahun} onChange={e => setStudentForm({ ...studentForm, tahun: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="cth: 4" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Kelas</label>
                                                <input value={studentForm.kelas} onChange={e => setStudentForm({ ...studentForm, kelas: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="cth: Iqra 2" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">
                                                    Cawangan {currentUser.Role.toLowerCase() !== 'superadmin' && <span className="font-normal text-slate-400">(terkunci ke cawangan anda)</span>}
                                                </label>
                                                <input
                                                    list="addstudent-branch-options"
                                                    required
                                                    disabled={currentUser.Role.toLowerCase() !== 'superadmin'}
                                                    value={studentForm.cawangan}
                                                    onChange={e => setStudentForm({ ...studentForm, cawangan: e.target.value })}
                                                    className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200 disabled:bg-slate-100 disabled:text-slate-400"
                                                    placeholder="cth: Al Furqan"
                                                />
                                                <datalist id="addstudent-branch-options">
                                                    {realBranches.map(b => <option key={b} value={b} />)}
                                                </datalist>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">
                                                    Guru Kelas <span className="font-normal text-slate-400">(pilih dari senarai Database Guru cawangan ni, atau taip nama baharu)</span>
                                                </label>
                                                <input
                                                    list="guru-kelas-options"
                                                    value={studentForm.guruKelas}
                                                    onChange={e => {
                                                        const namaGuru = e.target.value;
                                                        const matched = guruForBranch.find(g => g.nama === namaGuru);
                                                        setStudentForm(prev => ({
                                                            ...prev,
                                                            guruKelas: namaGuru,
                                                            noGuruKelas: matched ? matched.noTelefon : prev.noGuruKelas
                                                        }));
                                                    }}
                                                    className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200"
                                                    placeholder="cth: Cikgu Siti"
                                                />
                                                <datalist id="guru-kelas-options">
                                                    {guruForBranch.map(g => <option key={g.id} value={g.nama} />)}
                                                </datalist>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">No. Guru Kelas</label>
                                                <input value={studentForm.noGuruKelas} onChange={e => setStudentForm({ ...studentForm, noGuruKelas: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="No. telefon guru" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Nama Waris</label>
                                                <input value={studentForm.namaWaris} onChange={e => setStudentForm({ ...studentForm, namaWaris: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="Nama ibu/bapa/penjaga" />
                                            </div>
                                            <div></div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">No. Tel Waris (1)</label>
                                                <input value={studentForm.noTelWaris1} onChange={e => setStudentForm({ ...studentForm, noTelWaris1: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="cth: 0123456789" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">No. Tel Waris (2) <span className="font-normal text-slate-400">— pilihan</span></label>
                                                <input value={studentForm.noTelWaris2} onChange={e => setStudentForm({ ...studentForm, noTelWaris2: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="cth: 0198765432" />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Alamat</label>
                                                <textarea value={studentForm.alamat} onChange={e => setStudentForm({ ...studentForm, alamat: e.target.value })} rows={2} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="Alamat surat-menyurat"></textarea>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Yuran Pendaftaran (RM)</label>
                                                <input type="number" step="0.01" min="0" value={studentForm.yuranPendaftaran} onChange={e => setStudentForm({ ...studentForm, yuranPendaftaran: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="0.00" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Yuran Bulanan (RM)</label>
                                                <input type="number" step="0.01" min="0" value={studentForm.yuranBulanan} onChange={e => setStudentForm({ ...studentForm, yuranBulanan: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-sky-200" placeholder="0.00" />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Gambar Pelajar <span className="font-normal text-slate-400">— pilihan</span></label>
                                                <div className="flex items-center gap-4">
                                                    {studentPhotoPreview && (
                                                        <img src={studentPhotoPreview} alt="Preview" className="w-16 h-16 rounded-xl object-cover border border-slate-200" />
                                                    )}
                                                    <input type="file" accept="image/*" onChange={handleStudentPhotoChange} className="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-50 file:text-sky-600 hover:file:bg-sky-100" />
                                                </div>
                                                {editingStudentIC && <p className="text-[10px] text-slate-400 mt-1">Pilih fail baharu untuk ganti gambar sedia ada, atau biar kosong untuk kekalkan gambar yang ada sekarang.</p>}
                                            </div>
                                        </div>

                                        <div className="flex gap-2 pt-2">
                                            <button type="submit" disabled={savingStudent} className="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-sm transition disabled:opacity-60 flex items-center justify-center gap-2">
                                                {savingStudent ? <div className="animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-white"></div> : <Icon name="save" size={16} />}
                                                {editingStudentIC ? 'Kemaskini Pelajar' : 'Simpan Pelajar'}
                                            </button>
                                            {editingStudentIC ? (
                                                <button type="button" onClick={() => { setView('database'); resetStudentForm(); }} className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition text-sm font-semibold">
                                                    Batal
                                                </button>
                                            ) : (
                                                <button type="button" onClick={resetStudentForm} className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition text-sm font-semibold">
                                                    Kosongkan
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                )}

                                {addStudentTab === 'bulk' && (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4 max-w-5xl">
                                        <div>
                                            <h3 className="font-bold text-slate-700">Muat Naik Pukal (CSV)</h3>
                                            <p className="text-xs text-slate-500 mt-1">
                                                Muat turun template dulu, isi ikut format (satu baris = satu pelajar), kemudian muat naik semula fail tu.
                                                {currentUser.Role.toLowerCase() !== 'superadmin' && ` Column "Cawangan" dalam CSV akan diabaikan — semua rekod ditambah terus ke cawangan ${currentUser.Cawangan}.`}
                                                {' '}Gambar Pelajar TIADA sokongan upload dalam mod pukal — kalau nak isi, guna terus link Google Drive (share link biasa) dalam column tu, atau kosongkan dan tambah gambar kemudian melalui borang Satu-Satu / kemaskini terus di Google Sheet.
                                            </p>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <button onClick={downloadStudentTemplate} type="button" className="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition text-sm font-semibold">
                                                <Icon name="download" size={16} /> Muat Turun Template CSV
                                            </button>
                                            <label className="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white transition text-sm font-semibold cursor-pointer">
                                                <Icon name="upload" size={16} /> Pilih Fail CSV
                                                <input type="file" accept=".csv" onChange={handleBulkFileSelect} className="hidden" />
                                            </label>
                                            {bulkFileName && <span className="text-xs text-slate-500 self-center">Fail: {bulkFileName}</span>}
                                        </div>

                                        {bulkError && (
                                            <div className="p-3 bg-red-50 text-red-600 text-xs rounded-lg border border-red-100 flex items-center gap-2">
                                                <Icon name="alert-circle" size={14} /> {bulkError}
                                            </div>
                                        )}

                                        {bulkResult && (
                                            <div className="p-4 bg-green-50 text-green-700 text-sm rounded-lg border border-green-100 space-y-2">
                                                <p className="font-semibold flex items-center gap-2"><Icon name="check-circle" size={16} /> Berjaya tambah {bulkResult.added} daripada {bulkResult.total} pelajar.</p>
                                                {bulkResult.skipped && bulkResult.skipped.length > 0 && (
                                                    <div className="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg p-3 space-y-1">
                                                        <p className="font-semibold">{bulkResult.skipped.length} baris dilangkau:</p>
                                                        {bulkResult.skipped.map((s, i) => (
                                                            <p key={i}>Baris {s.row} ({s.nama || '-'} / {s.ic || '-'}): {s.reason}</p>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {bulkRows.length > 0 && (
                                            <div className="space-y-3">
                                                <div className="overflow-x-auto max-h-96 border border-slate-100 rounded-xl">
                                                    <table className="w-full text-left border-collapse text-xs">
                                                        <thead>
                                                            <tr className="bg-slate-50 text-slate-500 uppercase tracking-wider border-b border-slate-100 sticky top-0">
                                                                <th className="p-3">Baris</th>
                                                                <th className="p-3">Status</th>
                                                                <th className="p-3">Nama</th>
                                                                <th className="p-3">IC</th>
                                                                <th className="p-3">Cawangan</th>
                                                                <th className="p-3">Catatan</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100 text-slate-700">
                                                            {bulkRows.map((r, idx) => (
                                                                <tr key={idx} className={r._status === 'error' ? 'bg-red-50' : r._status === 'warning' ? 'bg-amber-50' : ''}>
                                                                    <td className="p-3">{r._row}</td>
                                                                    <td className="p-3">
                                                                        {r._status === 'error' && <span className="px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-semibold">Ralat</span>}
                                                                        {r._status === 'warning' && <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-semibold">Nota</span>}
                                                                        {r._status === 'ok' && <span className="px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-semibold">OK</span>}
                                                                    </td>
                                                                    <td className="p-3">{r['Nama'] || '-'}</td>
                                                                    <td className="p-3">{r['IC'] || '-'}</td>
                                                                    <td className="p-3">{r['Cawangan'] || '-'}</td>
                                                                    <td className="p-3 text-slate-500">{r._reason || '-'}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                                <div className="flex items-center justify-between">
                                                    <p className="text-xs text-slate-500">
                                                        {bulkRows.filter(r => r._status !== 'error').length} rekod sah akan dimuat naik daripada {bulkRows.length} baris.
                                                    </p>
                                                    <div className="flex gap-2">
                                                        <button onClick={resetBulkUpload} type="button" className="px-4 py-2 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition text-xs font-semibold">
                                                            Batal
                                                        </button>
                                                        <button
                                                            onClick={submitBulkStudents}
                                                            disabled={bulkUploading || bulkRows.filter(r => r._status !== 'error').length === 0}
                                                            className="px-6 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-sm transition disabled:opacity-60 flex items-center justify-center gap-2 text-xs"
                                                        >
                                                            {bulkUploading ? <div className="animate-spin rounded-full h-3 w-3 border-t-2 border-b-2 border-white"></div> : <Icon name="upload" size={14} />}
                                                            Sahkan & Muat Naik ({bulkRows.filter(r => r._status !== 'error').length})
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        <footer className="mt-12 text-center text-slate-400 text-sm pb-8">
                            &copy; 2026 Tadika Pintar System. All rights reserved.
                        </footer>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- PWA: daftar Service Worker (perlu untuk installability Chrome/Android/Desktop) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => { /* offline/gagal daftar — tak fatal, app tetap jalan tanpa PWA */ });
            });
        }
    </script>
</body>
</html>
